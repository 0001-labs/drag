<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@0001-labs/drag demo</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #f5f7f8;
        color: #172126;
      }

      main {
        width: min(720px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0;
      }

      h1 {
        margin: 0 0 20px;
        font-size: 28px;
        letter-spacing: 0;
      }

      drag-list {
        display: grid;
        gap: 8px;
      }

      drag-item {
        display: grid;
        grid-template-columns: 40px 1fr;
        align-items: center;
        min-height: 48px;
        border: 1px solid #ccd5d8;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 1px 2px rgb(18 32 38 / 8%);
      }

      drag-handle {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        margin-left: 8px;
        border-radius: 6px;
        color: #4b5f66;
        cursor: grab;
        user-select: none;
      }

      drag-handle:focus-visible {
        outline: 2px solid #0f766e;
        outline-offset: 2px;
      }

      drag-handle::before {
        content: "↕";
        font-size: 18px;
        line-height: 1;
      }

      .item-label {
        padding: 0 14px;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>@0001-labs/drag</h1>
      <drag-list aria-label="Project tasks">
        <drag-item value="research" label="Research architecture">
          <drag-handle aria-label="Move Research architecture"></drag-handle>
          <span class="item-label">Research architecture</span>
        </drag-item>
        <drag-item value="engine" label="Build core engine">
          <drag-handle aria-label="Move Build core engine"></drag-handle>
          <span class="item-label">Build core engine</span>
        </drag-item>
        <drag-item value="tests" label="Write deterministic tests">
          <drag-handle aria-label="Move Write deterministic tests"></drag-handle>
          <span class="item-label">Write deterministic tests</span>
        </drag-item>
      </drag-list>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
